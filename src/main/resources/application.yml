spring:
  application:
    name: ai-repair-assistant-backend
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/ai_repair_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:repair_assistant}
    password: ${MYSQL_PASSWORD:repair_assistant}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

repair-assistant:
  web:
    allowed-origins:
      # Vite 的标准端口与本项目演示端口都允许 localhost/127.0.0.1 访问。
      # 部署到独立前端域名时，再通过 FRONTEND_ORIGIN 追加该域名即可。
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4198
      - http://127.0.0.1:4198
      - ${FRONTEND_ORIGIN:http://localhost:5173}
  knowledge:
    source-path: ${KNOWLEDGE_SOURCE_PATH:./data/knowledge}
    version: ${KNOWLEDGE_VERSION:demo-v1}
    import-enabled: ${KNOWLEDGE_IMPORT_ENABLED:true}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:ai_repair_knowledge_v1}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-5-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:512}
  problem-understanding:
    semantic-fallback-enabled: ${SEMANTIC_FALLBACK_ENABLED:true}
    # 规则候选已过滤 <35 的弱信号；达到 35 即可进入 AI 分析且不调用 LLM。
    rule-classification-accept-score: ${RULE_CLASSIFICATION_ACCEPT_SCORE:35}
    rule-classification-min-score-gap: ${RULE_CLASSIFICATION_MIN_SCORE_GAP:15}
    llm-classification-accept-score: ${LLM_CLASSIFICATION_ACCEPT_SCORE:0.0}
    # 保留兼容配置；当前实现仅在规则未达到阈值时调用 LLM。
    llm-field-completion-after-classification-enabled: ${LLM_FIELD_COMPLETION_AFTER_CLASSIFICATION_ENABLED:false}
